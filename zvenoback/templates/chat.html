<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — ZvenoBack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
</div>

<div class="container">

    <div id="header-container"></div>

    <div class="chat-layout">

        <!-- ═══ ЛЕВАЯ: СПИСОК ЧАТОВ ═══ -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="chats-sidebar-header">
                <a href="/chats" class="chat-back-btn">←</a>
                <h2>💬 Чаты</h2>
                <button class="chats-new-btn" id="chat-new-btn">+</button>
            </div>
            <div class="chats-list" id="chats-list">
                <div class="feed-loading"><div class="spinner"></div></div>
            </div>
        </aside>

        <!-- ═══ ПРАВАЯ: ЧАТ ═══ -->
        <main class="chat-main">

            <div class="chat-header" id="chat-header">
                <div class="chat-header-loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="feed-loading">
                    <div class="spinner"></div>
                    <div>Загрузка сообщений...</div>
                </div>
            </div>

            <div class="chat-input-wrap">
                <div class="chat-input-container">
                    <textarea id="chat-input"
                              class="chat-input"
                              placeholder="Сообщение (Enter — отправить, Shift+Enter — новая строка)"
                              rows="1"></textarea>
                    <button class="chat-send-btn" id="chat-send-btn" disabled>▶</button>
                </div>
                <div class="chat-input-hint">
                    🔐 <b>Только участники чата</b> могут читать сообщения
                </div>
            </div>

        </main>

    </div>

</div>

<!-- ═══ МОДАЛКА ДОБАВЛЕНИЯ УЧАСТНИКА ═══ -->
<div class="modal-overlay hidden" id="add-member-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>➕ Добавить участника</h3>
            <button class="modal-close" data-close-add-member>✕</button>
        </div>

        <div class="form-group">
            <label class="form-label">Поиск юзера</label>
            <input type="text" id="add-member-search"
                   class="form-input" placeholder="Введи @ник или имя...">
        </div>

        <div class="new-chat-search-results" id="add-member-results"></div>

        <div class="form-error" id="add-member-error"></div>
    </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
