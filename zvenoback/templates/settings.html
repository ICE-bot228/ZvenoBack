<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — ZvenoBack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
</div>

<div class="container">

    <div id="header-container"></div>

    <div class="settings-layout">

        <div class="settings-header">
            <div class="settings-header-icon">⚙</div>
            <div>
                <h1>Настройки</h1>
                <p>Управляй своим аккаунтом</p>
            </div>
        </div>

        <!-- ═══ АККАУНТ ═══ -->
        <div class="card settings-card">
            <div class="settings-card-title">
                <span>👤</span> Аккаунт
            </div>

            <div class="settings-avatar-row">
                <div class="settings-avatar" id="settings-avatar">
                    <div class="spinner"></div>
                </div>
                <div class="settings-avatar-info">
                    <div class="settings-avatar-name" id="settings-username">—</div>
                    <div class="settings-avatar-login" id="settings-login">@—</div>
                    <button class="btn btn-small" id="settings-change-emoji">
                        🎨 Сменить эмодзи
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Имя (display)</label>
                <input type="text" id="settings-display" class="form-input" maxlength="40">
                <div class="form-hint">Как тебя показывать на сайте</div>
            </div>

            <div class="form-group">
                <label class="form-label">О себе</label>
                <textarea id="settings-bio" class="form-textarea" maxlength="300" placeholder="Расскажи о себе..."></textarea>
                <div class="form-hint">Макс 300 символов</div>
            </div>

            <div class="form-error" id="settings-profile-error"></div>

            <button class="btn btn-block" id="settings-save-profile">
                💾 Сохранить
            </button>
        </div>

        <!-- ═══ ПАРОЛЬ ═══ -->
        <div class="card settings-card">
            <div class="settings-card-title">
                <span>🔒</span> Смена пароля
            </div>

            <div class="form-group">
                <label class="form-label">Текущий пароль</label>
                <input type="password" id="settings-old-password" class="form-input" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label class="form-label">Новый пароль</label>
                <input type="password" id="settings-new-password" class="form-input" placeholder="Минимум 6 символов">
            </div>

            <div class="form-group">
                <label class="form-label">Повтори новый</label>
                <input type="password" id="settings-new-password2" class="form-input" placeholder="••••••••">
            </div>

            <div class="form-error" id="settings-password-error"></div>

            <button class="btn btn-block" id="settings-save-password">
                🔑 Сменить пароль
            </button>
        </div>

        <!-- ═══ ИНФО ═══ -->
        <div class="card settings-card">
            <div class="settings-card-title">
                <span>ℹ</span> Информация
            </div>

            <div class="settings-info" id="settings-info">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- ═══ ОПАСНАЯ ЗОНА ═══ -->
        <div class="card settings-card settings-danger">
            <div class="settings-card-title settings-danger-title">
                <span>⚠</span> Опасная зона
            </div>

            <div class="settings-danger-row">
                <div>
                    <div class="settings-danger-name">Выйти из аккаунта</div>
                    <div class="settings-danger-desc">Завершить текущую сессию</div>
                </div>
                <button class="btn btn-secondary" id="settings-logout">
                    🚪 Выйти
                </button>
            </div>
        </div>

    </div>

</div>

<script src="/static/common.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/settings.js"></script>
</body>
</html>
