<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ZvenoBack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
</div>

<div class="container-narrow">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" style="text-decoration:none;color:inherit;">
                <div class="auth-logo">ZB</div>
            </a>
            <h1>Создать аккаунт</h1>
            <p>Присоединяйся к ZvenoBack</p>
        </div>

        <form id="reg-form">
            <!-- ВЫБОР ЭМОДЗИ-АВАТАРКИ -->
            <div class="form-group">
                <label class="form-label">Выбери свою аватарку</label>
                <div class="emoji-picker" id="emoji-picker">
                    <!-- JS заполнит -->
                </div>
                <input type="hidden" id="reg-emoji" value="🐱">
            </div>

            <!-- ЛОГИН -->
            <div class="form-group">
                <label class="form-label">Логин <span style="color:var(--text-dim);font-weight:400;">(@username)</span></label>
                <div class="input-with-prefix">
                    <span class="input-prefix">@</span>
                    <input type="text" id="reg-username" class="form-input"
                           placeholder="username" autocomplete="username"
                           maxlength="20" autofocus>
                </div>
                <div class="username-status" id="reg-username-status"></div>
                <div class="form-hint">3-20 символов: буквы, цифры, _</div>
            </div>

            <!-- ИМЯ -->
            <div class="form-group">
                <label class="form-label">Имя</label>
                <input type="text" id="reg-display" class="form-input"
                       placeholder="Например: Иван Иванов" maxlength="40">
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="reg-email" class="form-input"
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <!-- ПАРОЛЬ -->
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="reg-password" class="form-input"
                       placeholder="••••••••" autocomplete="new-password">
                <div class="form-hint">Минимум 6 символов</div>
            </div>

            <div class="form-group">
                <label class="form-label">Повтори пароль</label>
                <input type="password" id="reg-password2" class="form-input"
                       placeholder="••••••••" autocomplete="new-password">
            </div>

            <div class="form-error" id="reg-error"></div>

            <button type="submit" class="btn btn-block" id="reg-btn">
                Создать аккаунт
            </button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/auth.js"></script>
</body>
</html>
