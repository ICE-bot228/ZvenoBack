<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — ZvenoBack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
</div>

<div class="container">

    <div id="header-container"></div>

    <div class="profile-layout">

        <!-- ═══ ШАПКА ПРОФИЛЯ ═══ -->
        <div class="card profile-header-card" id="profile-header">
            <div class="profile-loading">
                <div class="spinner"></div>
                <div>Загрузка профиля...</div>
            </div>
        </div>

        <!-- ═══ ВКЛАДКИ ═══ -->
        <div class="profile-tabs" id="profile-tabs">
            <button class="profile-tab active" data-tab="posts">
                📝 Стена
            </button>
            <button class="profile-tab" data-tab="friends">
                👥 Друзья
            </button>
            <button class="profile-tab" data-tab="about">
                ℹ О себе
            </button>
        </div>

        <!-- ═══ СТЕНА ═══ -->
        <div class="profile-tab-content active" id="tab-posts">
            <div id="profile-post-form-wrap"></div>

            <div id="profile-posts">
                <div class="feed-loading">
                    <div class="spinner"></div>
                    <div>Загрузка постов...</div>
                </div>
            </div>

            <div class="feed-more hidden" id="profile-feed-more">
                <button class="btn btn-secondary" id="profile-load-more">
                    Загрузить ещё
                </button>
            </div>
        </div>

        <!-- ═══ ДРУЗЬЯ ═══ -->
        <div class="profile-tab-content" id="tab-friends">
            <div id="profile-friends">
                <div class="feed-loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- ═══ О СЕБЕ ═══ -->
        <div class="profile-tab-content" id="tab-about">
            <div class="card" id="profile-about">
                <div class="feed-loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- ═══ МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ (с эмодзи-пикером) ═══ -->
<div class="modal-overlay hidden" id="edit-profile-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>✏ Редактировать профиль</h3>
            <button class="modal-close" data-close-modal>✕</button>
        </div>

        <form id="edit-profile-form">

            <!-- ЭМОДЗИ-ПИКЕР -->
            <div class="form-group">
                <label class="form-label">Аватарка (эмодзи)</label>
                <div class="emoji-picker" id="edit-emoji-picker">
                    <div class="feed-loading" style="grid-column:1/-1;padding:20px 0;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- ИМЯ -->
            <div class="form-group">
                <label class="form-label">Имя</label>
                <input type="text" id="edit-display" class="form-input"
                       placeholder="Как тебя показывать" maxlength="40">
            </div>

            <!-- БИО -->
            <div class="form-group">
                <label class="form-label">О себе</label>
                <textarea id="edit-bio" class="form-textarea"
                          placeholder="Расскажи о себе..." maxlength="300"></textarea>
                <div class="form-hint">Макс 300 символов</div>
            </div>

            <div class="form-error" id="edit-error"></div>

            <div class="flex gap-10" style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-block" id="edit-submit">
                    Сохранить
                </button>
                <button type="button" class="btn btn-secondary" data-close-modal>
                    Отмена
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/profile.js"></script>
</body>
</html>
