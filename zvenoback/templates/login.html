<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ZvenoBack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
</div>

<div class="container-narrow">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" style="text-decoration:none;color:inherit;">
                <div class="auth-logo">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="zbGrad2" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#0078ff"/>
                                <stop offset="100%" stop-color="#a020f0"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="url(#zbGrad2)"/>
                        <text x="50" y="60" text-anchor="middle" font-size="26" font-weight="900"
                              fill="white" font-family="Arial">ZB</text>
                    </svg>
                </div>
            </a>
            <h1>С возвращением</h1>
            <p>Войди в свой аккаунт ZvenoBack</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Ник или Email</label>
                <input type="text" id="login-username" class="form-input"
                       placeholder="username" autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="login-password" class="form-input"
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="form-error" id="login-error"></div>

            <button type="submit" class="btn btn-block" id="login-btn">
                Войти
            </button>
        </form>

        <div class="auth-footer">
            Нет аккаунта? <a href="/register">Создать</a>
        </div>
    </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/auth.js"></script>
</body>
</html>
