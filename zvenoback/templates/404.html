<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
</div>

<div class="error-page">
    <div class="error-content">

        <!-- Анимированный глитч-404 -->
        <div class="error-glitch" data-text="404">404</div>

        <div class="error-icon">🔍</div>

        <h1 class="error-title">Страница не найдена</h1>

        <p class="error-text">
            Кажется, эта страница <b>потерялась</b> где-то в недрах ZvenoBack.<br>
            Возможно, ссылка устарела или её никогда не существовало.
        </p>

        <div class="error-actions">
            <a href="/" class="btn">🏠 На главную</a>
            <a href="javascript:history.back()" class="btn btn-secondary">← Назад</a>
        </div>

        <div class="error-hint">
            💡 Подсказка: проверь правильность адреса в строке браузера
        </div>

    </div>
</div>

</body>
</html>
